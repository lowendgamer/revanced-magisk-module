[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
#patches-version = "dev"
#patches-version = "v1.48.0-dev.12" 
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "module"
#arch = "all"
#dpi = "nodpi"
#version = "21.16.256"
#version = "21.13.164"
#version = "21.04.223"
direct-dlurl = "https://github.com/E85Addict/APKs/releases/tag/com.google.android.youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
enable-update-checks = true

